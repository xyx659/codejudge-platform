server:
  port: 8080

spring:
  application:
    name: codejudge-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codejudge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:test}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://test:123456@localhost:27017/codejudge?authSource=admin}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# JWT 配置（secret 需 >= 32 字节，生产环境务必更换）
jwt:
  secret: codejudge-platform-jwt-secret-key-change-in-production-2026
  expiration: 86400000

system:
  config:
    encryption-key: ${SYSTEM_CONFIG_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

logging:
  file:
    name: logs/codejudge.log
  level:
    root: info
    com.codejudge.platform: debug
    org.springframework.web.servlet.mvc.method.annotation: warn
